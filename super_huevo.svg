<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra suave -->
    <filter id="heroShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="capeShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#7f1d1d" flood-opacity="0.4"/>
    </filter>

    <!-- Gradientes de la capa roja -->
    <linearGradient id="capeGradLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="capeGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="capeBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Gradiente del huevo (blanco marfil con sombras suaves 3D) -->
    <radialGradient id="eggBodyGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fffdf7"/>
      <stop offset="80%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f5e6b8"/>
    </radialGradient>

    <!-- Gradiente del antifaz rojo -->
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Gradiente del broche dorado de la capa -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Brillo especular -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ==================== 1. CAPA TRASERA (VIENTO) ==================== -->
  <g filter="url(#capeShadow)">
    <!-- Parte trasera central de la capa -->
    <path d="M 68 128 C 50 162, 58 188, 76 195 C 100 186, 115 188, 130 196 C 145 186, 152 160, 132 128 Z" fill="url(#capeBack)"/>
    
    <!-- Ala izquierda de la capa ondulando -->
    <path d="M 62 112 C 40 105, 12 125, 8 160 C 6 182, 28 185, 45 174 C 58 165, 66 142, 68 125 Z" fill="url(#capeGradLeft)"/>
    <!-- Pliegue de sombra ala izquierda -->
    <path d="M 22 142 C 34 160, 46 172, 56 170 C 44 158, 38 140, 36 130 Z" fill="#7f1d1d" opacity="0.4"/>

    <!-- Ala derecha de la capa ondulando heroicamente -->
    <path d="M 138 112 C 160 105, 188 125, 192 160 C 194 182, 172 185, 155 174 C 142 165, 134 142, 132 125 Z" fill="url(#capeGradRight)"/>
    <!-- Pliegue de sombra ala derecha -->
    <path d="M 178 142 C 166 160, 154 172, 144 170 C 156 158, 162 140, 164 130 Z" fill="#7f1d1d" opacity="0.4"/>
  </g>

  <!-- ==================== 2. CUERPO DEL HUEVO ==================== -->
  <g filter="url(#heroShadow)">
    <!-- Silueta principal del huevo superhéroe -->
    <path d="M 100 24 
             C 142 24, 160 82, 160 128 
             C 160 168, 134 188, 100 188 
             C 66 188, 40 168, 40 128 
             C 40 82, 58 24, 100 24 Z" 
          fill="url(#eggBodyGrad)" 
          stroke="#e2d09e" 
          stroke-width="1.8"/>

    <!-- Brillo especular curvado en la parte superior izquierda -->
    <path d="M 92 34 
             C 74 38, 56 68, 54 94 
             C 53 80, 68 44, 90 35 Z" 
          fill="url(#shineGrad)"/>
    <ellipse cx="80" cy="48" rx="8" ry="16" transform="rotate(-28 80 48)" fill="#ffffff" opacity="0.65"/>
  </g>

  <!-- ==================== 3. ANTIFAZ ROJO (HEROIC MASK) ==================== -->
  <g filter="url(#heroShadow)">
    <!-- Antifaz rojo con alas estilizadas -->
    <path d="M 100 86 
             C 114 86, 138 78, 156 68 
             C 162 76, 160 92, 150 102 
             C 136 112, 120 108, 108 97
             C 104 93, 96 93, 92 97
             C 80 108, 64 112, 50 102
             C 40 92, 38 76, 44 68
             C 62 78, 86 86, 100 86 Z" 
          fill="url(#maskGrad)" 
          stroke="#991b1b" 
          stroke-width="1.5"/>

    <!-- Agujero ojo izquierdo del antifaz -->
    <path d="M 64 88 C 64 78, 76 75, 84 81 C 88 84, 88 94, 82 98 C 74 102, 64 98, 64 88 Z" fill="#ffffff"/>
    
    <!-- Agujero ojo derecho del antifaz -->
    <path d="M 136 88 C 136 78, 124 75, 116 81 C 112 84, 112 94, 118 98 C 126 102, 136 98, 136 88 Z" fill="#ffffff"/>

    <!-- Pupila y brillo ojo izquierdo (mirada heroica y alegre) -->
    <ellipse cx="76" cy="88" rx="7" ry="8" fill="#1e293b"/>
    <circle cx="74" cy="85" r="3" fill="#38bdf8"/>
    <circle cx="73" cy="84" r="1.8" fill="#ffffff"/>
    <circle cx="78" cy="91" r="1.2" fill="#ffffff"/>

    <!-- Pupila y brillo ojo derecho -->
    <ellipse cx="124" cy="88" rx="7" ry="8" fill="#1e293b"/>
    <circle cx="122" cy="85" r="3" fill="#38bdf8"/>
    <circle cx="121" cy="84" r="1.8" fill="#ffffff"/>
    <circle cx="126" cy="91" r="1.2" fill="#ffffff"/>

    <!-- Cejas heroicas y decididas sobre el antifaz -->
    <path d="M 60 70 Q 74 65 84 73" stroke="#991b1b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 140 70 Q 126 65 116 73" stroke="#991b1b" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ==================== 4. EXPRESIÓN FACIAL ==================== -->
  <!-- Mejillas sonrosadas (blush) -->
  <ellipse cx="56" cy="112" rx="7" ry="4" fill="#f43f5e" opacity="0.35"/>
  <ellipse cx="144" cy="112" rx="7" ry="4" fill="#f43f5e" opacity="0.35"/>

  <!-- Sonrisa pícara y triunfante -->
  <path d="M 88 116 Q 100 128 112 116" stroke="#475569" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M 94 120 Q 100 126 106 120" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" fill="#ffffff"/>

  <!-- ==================== 5. EMBLEMA HEROICO (ESTRELLA / RAYO) ==================== -->
  <g transform="translate(100, 148)">
    <!-- Escudo circular dorado en el pecho -->
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5" filter="url(#heroShadow)"/>
    <circle cx="0" cy="0" r="11.5" fill="#dc2626"/>
    
    <!-- Rayo heroico en el emblema -->
    <path d="M 1 -8 L -6 0 L -1 0 L -3 8 L 6 -1 L 1 -1 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>
  </g>

  <!-- ==================== 6. BRAZOS EN JARRAS (POWER POSE) ==================== -->
  <!-- Brazo izquierdo en jarra -->
  <g filter="url(#heroShadow)">
    <path d="M 52 130 C 35 135, 34 152, 46 156 C 52 158, 56 150, 56 142" 
          fill="none" stroke="#fffdf7" stroke-width="9" stroke-linecap="round"/>
    <path d="M 52 130 C 35 135, 34 152, 46 156 C 52 158, 56 150, 56 142" 
          fill="none" stroke="#e2d09e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Guantelete o mano en la cintura -->
    <circle cx="50" cy="153" r="5.5" fill="#ef4444" stroke="#b91c1c" stroke-width="1.2"/>
  </g>

  <!-- Brazo derecho en jarra -->
  <g filter="url(#heroShadow)">
    <path d="M 148 130 C 165 135, 166 152, 154 156 C 148 158, 144 150, 144 142" 
          fill="none" stroke="#fffdf7" stroke-width="9" stroke-linecap="round"/>
    <path d="M 148 130 C 165 135, 166 152, 154 156 C 148 158, 144 150, 144 142" 
          fill="none" stroke="#e2d09e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Guantelete o mano en la cintura -->
    <circle cx="150" cy="153" r="5.5" fill="#ef4444" stroke="#b91c1c" stroke-width="1.2"/>
  </g>

  <!-- ==================== 7. BROCHE DEL CUELLO DE LA CAPA ==================== -->
  <g>
    <!-- Cinta frontal del cuello de la capa roja -->
    <path d="M 66 120 C 78 128, 122 128, 134 120" stroke="#dc2626" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Broche joya dorada -->
    <circle cx="100" cy="125" r="5.5" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="1.2" filter="url(#heroShadow)"/>
    <circle cx="100" cy="125" r="2.5" fill="#dc2626"/>
  </g>
</svg>
