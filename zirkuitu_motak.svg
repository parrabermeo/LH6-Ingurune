<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="circuitBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="bulbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#facc15" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#090d16"/>
  <rect x="25" y="25" width="1150" height="625" rx="28" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- TITULUA -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-350" y="-30" width="700" height="60" rx="30" fill="#0284c7"/>
    <text y="8" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="1">🔌 ZIRKUITU MOTAK: SERIEA VS PARALELOA</text>
    <text y="52" fill="#38bdf8" font-size="14" font-weight="700">KORRONTE ELEKTRIKOAREN IBILBIDEAK ETA BONBILLEN PORTAERA</text>
  </g>

  <!-- EZKERREKO PANELA: SERIEKO ZIRKUITUA -->
  <g transform="translate(55, 120)">
    <rect width="525" height="500" rx="24" fill="url(#circuitBg)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="25" y="20" width="240" height="36" rx="18" fill="#0369a1"/>
    <text x="45" y="44" fill="#ffffff" font-size="16" font-weight="900">🔗 1. SERIEKO ZIRKUITUA</text>

    <!-- ZIRKUITU ESKEMA BISUALA (SERIEA) -->
    <g transform="translate(50, 80)">
      <!-- Kablearen lerroa (laukizuzena biribila) -->
      <rect x="20" y="20" width="380" height="230" rx="20" fill="none" stroke="#f59e0b" stroke-width="6"/>
      
      <!-- Pila (ezkerrean) -->
      <g transform="translate(20, 110)">
        <rect x="-16" y="-35" width="32" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
        <rect x="-8" y="-42" width="16" height="7" rx="3" fill="#94a3b8"/>
        <text x="0" y="5" fill="#f87171" font-size="16" font-weight="900" text-anchor="middle">+</text>
        <text x="0" y="25" fill="#60a5fa" font-size="16" font-weight="900" text-anchor="middle">-</text>
        <text x="-25" y="5" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="end">Pila (9V)</text>
      </g>

      <!-- Bonbilla 1 (Goian) -->
      <g transform="translate(150, 20)">
        <circle r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="3" filter="url(#bulbGlow)"/>
        <text y="7" fill="#854d0e" font-size="16" font-weight="900" text-anchor="middle">💡 L1</text>
      </g>

      <!-- Bonbilla 2 (Goian) -->
      <g transform="translate(280, 20)">
        <circle r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="3" filter="url(#bulbGlow)"/>
        <text y="7" fill="#854d0e" font-size="16" font-weight="900" text-anchor="middle">💡 L2</text>
      </g>

      <!-- Etengailua (Behean) -->
      <g transform="translate(210, 250)">
        <circle cx="-30" cy="0" r="5" fill="#38bdf8"/>
        <circle cx="30" cy="0" r="5" fill="#38bdf8"/>
        <line x1="-30" y1="0" x2="25" y2="-15" stroke="#38bdf8" stroke-width="4"/>
        <text y="25" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">Etengailua</text>
      </g>

      <!-- Geziak: korrontearen fluxua -->
      <path d="M 60 18 L 80 18" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)"/>
      <path d="M 370 18 L 390 18" stroke="#ef4444" stroke-width="3"/>
    </g>

    <!-- AZALPEN ETA EZAUGARRIAK -->
    <g transform="translate(30, 360)" fill="#e2e8f0" font-size="13">
      <rect width="465" height="110" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <text x="18" y="28" fill="#38bdf8" font-weight="900" font-size="14">Ezaugarri Nagusiak (Kate Moduan):</text>
      <text x="18" y="52">• Elementuak bat bestearen atzetik konektatuta (bide bakarra).</text>
      <text x="18" y="74" fill="#f87171" font-weight="800">⚠️ BONBILLA BAT KENDUZ GERO:</text>
      <text x="18" y="94" fill="#cbd5e1">Zirkuitua IREKITA gelditzen da eta BESTEA ERE ITZALI EGITEN DA!</text>
    </g>
  </g>

  <!-- ESKUINEKO PANELA: PARALELOKO ZIRKUITUA -->
  <g transform="translate(620, 120)">
    <rect width="525" height="500" rx="24" fill="url(#circuitBg)" stroke="#10b981" stroke-width="2"/>
    <rect x="25" y="20" width="270" height="36" rx="18" fill="#059669"/>
    <text x="45" y="44" fill="#ffffff" font-size="16" font-weight="900">⚡ 2. ZIRKUITU PARALELOA</text>

    <!-- ZIRKUITU ESKEMA BISUALA (PARALELOA) -->
    <g transform="translate(50, 80)">
      <!-- Kable nagusiak -->
      <line x1="20" y1="40" x2="390" y2="40" stroke="#10b981" stroke-width="6"/>
      <line x1="20" y1="210" x2="390" y2="210" stroke="#10b981" stroke-width="6"/>
      <line x1="20" y1="40" x2="20" y2="210" stroke="#10b981" stroke-width="6"/>

      <!-- Pila (ezkerrean) -->
      <g transform="translate(20, 125)">
        <rect x="-16" y="-35" width="32" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
        <rect x="-8" y="-42" width="16" height="7" rx="3" fill="#94a3b8"/>
        <text x="0" y="5" fill="#f87171" font-size="16" font-weight="900" text-anchor="middle">+</text>
        <text x="0" y="25" fill="#60a5fa" font-size="16" font-weight="900" text-anchor="middle">-</text>
        <text x="-25" y="5" fill="#10b981" font-size="11" font-weight="800" text-anchor="end">Pila (9V)</text>
      </g>

      <!-- Adar 1: Bonbilla 1 -->
      <g transform="translate(180, 0)">
        <line x1="0" y1="40" x2="0" y2="210" stroke="#10b981" stroke-width="5"/>
        <g transform="translate(0, 125)">
          <circle r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="3" filter="url(#bulbGlow)"/>
          <text y="7" fill="#854d0e" font-size="16" font-weight="900" text-anchor="middle">💡 L1</text>
        </g>
      </g>

      <!-- Adar 2: Bonbilla 2 -->
      <g transform="translate(320, 0)">
        <line x1="0" y1="40" x2="0" y2="210" stroke="#10b981" stroke-width="5"/>
        <g transform="translate(0, 125)">
          <circle r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="3" filter="url(#bulbGlow)"/>
          <text y="7" fill="#854d0e" font-size="16" font-weight="900" text-anchor="middle">💡 L2</text>
        </g>
      </g>

      <!-- Nodoko konexioak (puntu berdeak) -->
      <circle cx="180" cy="40" r="7" fill="#4ade80"/>
      <circle cx="180" cy="210" r="7" fill="#4ade80"/>
      <circle cx="320" cy="40" r="7" fill="#4ade80"/>
      <circle cx="320" cy="210" r="7" fill="#4ade80"/>
    </g>

    <!-- AZALPEN ETA EZAUGARRIAK -->
    <g transform="translate(30, 360)" fill="#e2e8f0" font-size="13">
      <rect width="465" height="110" rx="14" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
      <text x="18" y="28" fill="#34d399" font-weight="900" font-size="14">Ezaugarri Nagusiak (Adar Independenteak):</text>
      <text x="18" y="52">• Sarrerak puntu berera eta irteerak beste puntu berera lotuta.</text>
      <text x="18" y="74" fill="#4ade80" font-weight="800">✅ BONBILLA BAT KENDUZ GERO:</text>
      <text x="18" y="94" fill="#cbd5e1">Korronteak beste adarretik jarraitzen du eta BESTEA PIZTUTA DAGO!</text>
    </g>
  </g>
</svg>