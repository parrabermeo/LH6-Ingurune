<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
    <rect width="300" height="400" fill="#ffe000"/>
    <rect x="300" width="300" height="400" fill="#ffffff"/>
    <!-- Papal Tiara and crossed Keys -->
    <g transform="translate(450, 200) scale(0.85)">
      <!-- Crossed Keys (Gold & Silver) -->
      <path d="M-40 -40 L40 40 M-40 40 L40 -40" stroke="#d4a017" stroke-width="12" stroke-linecap="round"/>
      <path d="M-40 -40 L40 40" stroke="#c0c0c0" stroke-width="8" stroke-linecap="round"/>
      <!-- Tiara crown -->
      <path d="M-25 -50 h50 v20 a25 25 0 0 1 -50 0 z" fill="#c0c0c0" stroke="#d4a017" stroke-width="3"/>
      <path d="M-20 -70 h40 v15 a20 20 0 0 1 -40 0 z" fill="#ffd700"/>
      <path d="M-12 -85 h24 v12 a12 12 0 0 1 -24 0 z" fill="#c0c0c0"/>
      <circle cx="0" cy="-90" r="5" fill="#ffd700"/>
    </g>
  </svg>