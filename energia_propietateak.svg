<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="propCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="propGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#0b1329"/>
  <rect x="25" y="25" width="1150" height="625" rx="28" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- TITULUA -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-350" y="-30" width="700" height="60" rx="30" fill="#059669" filter="url(#propGlow)"/>
    <text y="8" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="1">🔄 ENERGIAREN 4 PROPIETATEAK</text>
    <text y="52" fill="#34d399" font-size="14" font-weight="700">NAHIZ ETA IKUSTEZINA IZAN, HARK SORTUTAKO ALDAKETEK DEFINITZEN DUTE</text>
  </g>

  <!-- 4 PROPIETATEEN GRID-A -->
  <!-- 1. METATU -->
  <g transform="translate(70, 125)">
    <rect width="500" height="195" rx="22" fill="url(#propCard)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="25" y="25" width="56" height="56" rx="16" fill="#0284c7"/>
    <text x="53" y="62" fill="#fff" font-size="30" text-anchor="middle">📦</text>
    <text x="95" y="48" fill="#38bdf8" font-size="22" font-weight="900">1. METATU DAITEKE</text>
    <text x="95" y="70" fill="#94a3b8" font-size="13" font-weight="700">BARRUAN GORDE ONDOREN ERABILTZEKO</text>
    <text x="25" y="115" fill="#e2e8f0" font-size="14" font-weight="500">
      <tspan x="25" dy="0">• Energia hainbat euskarritan biltegiratu daiteke gerorako.</tspan>
      <tspan x="25" dy="24">• Behar denean soilik askatzen eta kontsumitzen da.</tspan>
      <tspan x="25" dy="30" fill="#38bdf8" font-weight="700">Adibidez:</tspan>
      <tspan fill="#cbd5e1"> Pilak, mugikorreko bateriak, erregai-tangak eta elikagaiak.</tspan>
    </text>
  </g>

  <!-- 2. GARRAIATU -->
  <g transform="translate(630, 125)">
    <rect width="500" height="195" rx="22" fill="url(#propCard)" stroke="#a855f7" stroke-width="2"/>
    <rect x="25" y="25" width="56" height="56" rx="16" fill="#9333ea"/>
    <text x="53" y="62" fill="#fff" font-size="30" text-anchor="middle">🚚</text>
    <text x="95" y="48" fill="#c084fc" font-size="22" font-weight="900">2. GARRAIATU DAITEKE</text>
    <text x="95" y="70" fill="#94a3b8" font-size="13" font-weight="700">LEKU BATETIK BESTERA ERAMAN</text>
    <text x="25" y="115" fill="#e2e8f0" font-size="14" font-weight="500">
      <tspan x="25" dy="0">• Sortzen den lekutik kontsumitzen den lekura bidaltzen da.</tspan>
      <tspan x="25" dy="24">• Modurik azkarrena: tentsio altuko sare elektrikoak.</tspan>
      <tspan x="25" dy="30" fill="#c084fc" font-weight="700">Adibidez:</tspan>
      <tspan fill="#cbd5e1"> Kable elektrikoak, petrolio-ontziak eta gasbideak.</tspan>
    </text>
  </g>

  <!-- 3. ERALDATU -->
  <g transform="translate(70, 340)">
    <rect width="500" height="195" rx="22" fill="url(#propCard)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="25" y="25" width="56" height="56" rx="16" fill="#d97706"/>
    <text x="53" y="62" fill="#fff" font-size="30" text-anchor="middle">🔄</text>
    <text x="95" y="48" fill="#fbbf24" font-size="22" font-weight="900">3. ERALDATU DAITEKE</text>
    <text x="95" y="70" fill="#94a3b8" font-size="13" font-weight="700">MOTA BATETIK BESTERA ALDATZEN DA</text>
    <text x="25" y="115" fill="#e2e8f0" font-size="14" font-weight="500">
      <tspan x="25" dy="0">• Energia ez da desagertzen, forma berri bat hartzen du.</tspan>
      <tspan x="25" dy="24">• Aparatuek energia mota bat hartu eta beste bat bihurtzen dute.</tspan>
      <tspan x="25" dy="30" fill="#fbbf24" font-weight="700">Adibidez:</tspan>
      <tspan fill="#cbd5e1"> Kimikoa (pila) → Elektrikoa → Argi eta beroa (bonbilla).</tspan>
    </text>
  </g>

  <!-- 4. TRANSFERITU -->
  <g transform="translate(630, 340)">
    <rect width="500" height="195" rx="22" fill="url(#propCard)" stroke="#ef4444" stroke-width="2"/>
    <rect x="25" y="25" width="56" height="56" rx="16" fill="#dc2626"/>
    <text x="53" y="62" fill="#fff" font-size="30" text-anchor="middle">➡️</text>
    <text x="95" y="48" fill="#f87171" font-size="22" font-weight="900">4. TRANSFERITU DAITEKE</text>
    <text x="95" y="70" fill="#94a3b8" font-size="13" font-weight="700">GORPUTZ BATETIK BESTE BATERA PASA</text>
    <text x="25" y="115" fill="#e2e8f0" font-size="14" font-weight="500">
      <tspan x="25" dy="0">• Objektu baten energiak beste objektu bati eragiten dio.</tspan>
      <tspan x="25" dy="24">• Beroa beroagotik hotzagora transmititzen da beti.</tspan>
      <tspan x="25" dy="30" fill="#f87171" font-weight="700">Adibidez:</tspan>
      <tspan fill="#cbd5e1"> Mailuak iltzeari kolpea (mekanikoa) edo suak eltza (beroa).</tspan>
    </text>
  </g>

  <!-- BEHEKO BANDA NAGUSIA: PRINTZIPIOA -->
  <g transform="translate(70, 555)">
    <rect width="1060" height="70" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="40" y="42" fill="#a5b4fc" font-size="18" font-weight="900">⚖️ PRINTZIPIO OINARRIZKOA:</text>
    <text x="320" y="42" fill="#ffffff" font-size="17" font-weight="800">«Energia ez da sortzen ezta desagertzen, eraldatu baino ez da egiten»</text>
  </g>
</svg>