<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="compCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#090d16"/>
  <rect x="25" y="25" width="1150" height="625" rx="28" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- TITULUA -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-370" y="-30" width="740" height="60" rx="30" fill="#7c3aed"/>
    <text y="8" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="1">⚙️ ZIRKUITUAREN OSAGAIAK &amp; SINBOLOAK</text>
    <text y="52" fill="#c4b5fd" font-size="14" font-weight="700">4 ELEMENTU TALDE NAGUSIAK ETA NAZIOARTEKO PLANOEN ERREPRESENTAZIOA</text>
  </g>

  <!-- 4 TALDE NAGUSIAK (2x2) -->
  <!-- 1. SORGAILUAK -->
  <g transform="translate(60, 125)">
    <rect width="525" height="235" rx="22" fill="url(#compCard)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="20" y="20" width="48" height="48" rx="14" fill="#0284c7"/>
    <text x="44" y="53" fill="#fff" font-size="24" text-anchor="middle">🔋</text>
    <text x="80" y="44" fill="#38bdf8" font-size="20" font-weight="900">1. SORGAILUAK (Generadoreak)</text>
    <text x="80" y="64" fill="#94a3b8" font-size="13" font-weight="700">KORRONTE ELEKTRIKOA SORTZEN DUTE</text>
    
    <text x="20" y="105" fill="#e2e8f0" font-size="13">
      <tspan x="20" dy="0">• Elektroiak mugiarazteko behar den tentsioa ematen dute.</tspan>
      <tspan x="20" dy="22">• <tspan fill="#38bdf8" font-weight="700">Motak:</tspan> Pilak (kimikoa), Bateria birkargagarriak,</tspan>
      <tspan x="20" dy="20">  Panel fotovoltaikoak (eguzkia) eta Dinamoak (biraketa).</tspan>
    </text>

    <!-- Sinboloa -->
    <g transform="translate(380, 155)">
      <rect x="-110" y="-30" width="220" height="60" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <line x1="-90" y1="0" x2="-20" y2="0" stroke="#38bdf8" stroke-width="3"/>
      <line x1="-20" y1="-20" x2="-20" y2="20" stroke="#f87171" stroke-width="5"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#60a5fa" stroke-width="3"/>
      <line x1="0" y1="0" x2="70" y2="0" stroke="#38bdf8" stroke-width="3"/>
      <text x="-25" y="-10" fill="#f87171" font-size="11" font-weight="900">+</text>
      <text x="8" y="-10" fill="#60a5fa" font-size="11" font-weight="900">-</text>
      <text x="80" y="5" fill="#38bdf8" font-size="11" font-weight="800">PILA</text>
    </g>
  </g>

  <!-- 2. HARTZAILEAK -->
  <g transform="translate(615, 125)">
    <rect width="525" height="235" rx="22" fill="url(#compCard)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="20" y="20" width="48" height="48" rx="14" fill="#d97706"/>
    <text x="44" y="53" fill="#fff" font-size="24" text-anchor="middle">💡</text>
    <text x="80" y="44" fill="#fbbf24" font-size="20" font-weight="900">2. HARTZAILEAK (Errezeptoreak)</text>
    <text x="80" y="64" fill="#94a3b8" font-size="13" font-weight="700">ELEKTRIZITATEA ERALDATZEN DUTE</text>

    <text x="20" y="105" fill="#e2e8f0" font-size="13">
      <tspan x="20" dy="0">• Korrontea beste energia mota batean bihurtzen dute:</tspan>
      <tspan x="20" dy="22">• <tspan fill="#fbbf24" font-weight="700">Bonbillak:</tspan> Argia eman • <tspan fill="#fbbf24" font-weight="700">Motorrak:</tspan> Biraketa eta mugimendua</tspan>
      <tspan x="20" dy="20">• <tspan fill="#fbbf24" font-weight="700">Burrunbagailuak:</tspan> Alarma-soinua • <tspan fill="#fbbf24" font-weight="700">Bozgorailuak:</tspan> Musika</tspan>
    </text>

    <!-- Sinboloak: Bonbilla & Motorra -->
    <g transform="translate(380, 155)">
      <rect x="-110" y="-30" width="220" height="60" rx="12" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
      <!-- Bonbilla -->
      <g transform="translate(-50, 0)">
        <line x1="-35" y1="0" x2="35" y2="0" stroke="#f59e0b" stroke-width="3"/>
        <circle r="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
        <line x1="-10" y1="-10" x2="10" y2="10" stroke="#f59e0b" stroke-width="2"/>
        <line x1="10" y1="-10" x2="-10" y2="10" stroke="#f59e0b" stroke-width="2"/>
        <text y="24" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">BONBILLA</text>
      </g>
      <!-- Motorra -->
      <g transform="translate(50, 0)">
        <line x1="-35" y1="0" x2="35" y2="0" stroke="#f59e0b" stroke-width="3"/>
        <circle r="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
        <text y="6" fill="#fbbf24" font-size="14" font-weight="900" text-anchor="middle">M</text>
        <text y="24" fill="#fbbf24" font-size="9" font-weight="800" text-anchor="middle">MOTORRA</text>
      </g>
    </g>
  </g>

  <!-- 3. KONTROL ELEMENTUAK -->
  <g transform="translate(60, 385)">
    <rect width="525" height="235" rx="22" fill="url(#compCard)" stroke="#10b981" stroke-width="2"/>
    <rect x="20" y="20" width="48" height="48" rx="14" fill="#059669"/>
    <text x="44" y="53" fill="#fff" font-size="24" text-anchor="middle">🔘</text>
    <text x="80" y="44" fill="#34d399" font-size="20" font-weight="900">3. KONTROL ELEMENTUAK</text>
    <text x="80" y="64" fill="#94a3b8" font-size="13" font-weight="700">KORRONTEAREN FLUXUA ARAUTZEN DUTE</text>

    <text x="20" y="105" fill="#e2e8f0" font-size="13">
      <tspan x="20" dy="0">• Korrontea igarotzen utzi (itxi) edo moztu (ireki) egiten dute.</tspan>
      <tspan x="20" dy="22">• <tspan fill="#34d399" font-weight="700">Etengailua:</tspan> Bi posizio finko (piztuta / itzalita).</tspan>
      <tspan x="20" dy="20">• <tspan fill="#34d399" font-weight="700">Sakagailua:</tspan> Botoia sakatzen den bitartean soilik (txirrina).</tspan>
    </text>

    <!-- Sinboloak: Etengailua & Sakagailua -->
    <g transform="translate(380, 155)">
      <rect x="-110" y="-30" width="220" height="60" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
      <!-- Etengailua -->
      <g transform="translate(-45, 0)">
        <circle cx="-25" cy="0" r="4" fill="#34d399"/>
        <circle cx="25" cy="0" r="4" fill="#34d399"/>
        <line x1="-25" y1="0" x2="20" y2="-12" stroke="#34d399" stroke-width="3"/>
        <text y="24" fill="#34d399" font-size="9" font-weight="800" text-anchor="middle">ETENGAILUA</text>
      </g>
      <!-- Sakagailua -->
      <g transform="translate(55, 0)">
        <circle cx="-25" cy="0" r="4" fill="#34d399"/>
        <circle cx="25" cy="0" r="4" fill="#34d399"/>
        <line x1="-20" y1="-8" x2="20" y2="-8" stroke="#34d399" stroke-width="3"/>
        <line x1="0" y1="-8" x2="0" y2="-18" stroke="#34d399" stroke-width="3"/>
        <text y="24" fill="#34d399" font-size="9" font-weight="800" text-anchor="middle">SAKAGAILUA</text>
      </g>
    </g>
  </g>

  <!-- 4. EROALEAK -->
  <g transform="translate(615, 385)">
    <rect width="525" height="235" rx="22" fill="url(#compCard)" stroke="#ec4899" stroke-width="2"/>
    <rect x="20" y="20" width="48" height="48" rx="14" fill="#db2777"/>
    <text x="44" y="53" fill="#fff" font-size="24" text-anchor="middle">➰</text>
    <text x="80" y="44" fill="#f472b6" font-size="20" font-weight="900">4. EROALEAK (Kable Elektrikoak)</text>
    <text x="80" y="64" fill="#94a3b8" font-size="13" font-weight="700">ELEMENTU GUZTIAK ELKARTZEN DITUZTE</text>

    <text x="20" y="105" fill="#e2e8f0" font-size="13">
      <tspan x="20" dy="0">• Korrontea zirkuituko atal batetik bestera eramaten dute.</tspan>
      <tspan x="20" dy="22">• <tspan fill="#f472b6" font-weight="700">Barruan:</tspan> Kobrezko haria (eroale aparta eta malgua).</tspan>
      <tspan x="20" dy="20">• <tspan fill="#f472b6" font-weight="700">Kanpoan:</tspan> Plastikozko geruza (isolatzaile segurua).</tspan>
    </text>

    <!-- Sinboloa: Kablea -->
    <g transform="translate(380, 155)">
      <rect x="-110" y="-30" width="220" height="60" rx="12" fill="#0f172a" stroke="#db2777" stroke-width="1.5"/>
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#f472b6" stroke-width="4"/>
      <text y="24" fill="#f472b6" font-size="10" font-weight="800" text-anchor="middle">EROALEA (KABLEA)</text>
    </g>
  </g>
</svg>